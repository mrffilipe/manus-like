[project]
name = "agent-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agent",
    "browser-service",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
agent = { path = ".", editable = true }
