[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-service"
version = "0.1.0"
description = "Isolated Playwright browser automation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "playwright==1.49.0",
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/browser_service"]
